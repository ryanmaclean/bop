name: Repo Health

on:
  pull_request:
  push:
    branches: [main]

jobs:
  health:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly-2026-02-20
          components: clippy, rustfmt

      - name: Install Nushell
        run: |
          v=$(cat .github/nu-version)
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${v}/nu-${v}-aarch64-apple-darwin.tar.gz" -o /tmp/nu.tar.gz
          tar -xzf /tmp/nu.tar.gz -C /tmp
          sudo install -m 755 "/tmp/nu-${v}-aarch64-apple-darwin/nu" /usr/local/bin/nu
          nu --version

      - name: Verify Nushell version matches pin
        run: |
          pinned=$(cat .github/nu-version)
          actual=$(nu --version | head -1)
          echo "pinned=$pinned actual=$actual"
          case "$actual" in
            "$pinned"*) ;;
            *) echo "Nushell version $actual does not match pinned version $pinned (.github/nu-version)"; exit 1 ;;
          esac

      # Nushell must be on PATH before `make check`: the dispatcher integration
      # tests (crates/bop-cli/tests/dispatcher_harness.rs) spawn
      # adapters/mock.nu, whose #!/usr/bin/env nu shebang fails with ENOENT
      # if nu isn't installed yet, which cascades into missing-card assertion
      # failures further down each test.
      - name: Build and quality gates
        run: make check

      # scripts/policy_check.nu delegates to `^bop policy check`, so the
      # binary `cargo test` just produced (via `make check`) needs to be
      # resolvable on PATH for the next step.
      - name: Add target/debug to PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Policy check (staged scope)
        run: nu scripts/policy_check.nu --staged --cards-dir .cards
