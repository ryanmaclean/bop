name: Windows core

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-core.yml
      - Cargo.toml
      - Cargo.lock
      - crates/bop-core/**
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-core.yml
      - Cargo.toml
      - Cargo.lock
      - crates/bop-core/**

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p bop-core
