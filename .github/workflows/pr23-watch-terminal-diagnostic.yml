# Diagnostic only. GitHub requires this workflow path on the default branch
# before workflow_dispatch can select a non-default ref.
name: BOP PR23 watch and terminal diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bop-pr23-watch-terminal-diagnostic
  cancel-in-progress: false

jobs:
  scoped-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed fixture source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b1664f77411961cc7942e38d7cbb1e65b2ece641
          persist-credentials: false
          submodules: false

      - name: Verify exact source and lock before compilation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b1664f77411961cc7942e38d7cbb1e65b2ece641'
          echo 'd16018d33360816f65c6fc3c1f27efeb87f3dc6b38b7399c357a27a4668a8c81  Cargo.lock' | sha256sum --check --status
          test -z "$(git status --porcelain)"
          mkdir -p diagnostic
          git rev-parse HEAD > diagnostic/source-commit.txt
          sha256sum Cargo.lock > diagnostic/lock-sha256.txt

      - name: Select pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly-2026-02-20

      - name: Read physical-row model from actual old and new frames
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-02-20 test --locked -p bop --bin bop \
            managed_watch::tests::virtual_pane_repaint_erases_wrapped_deleted_card_after_resize \
            -- --exact --nocapture 2>&1 | tee diagnostic/virtual-pane.log

      - name: Witness exact metadata path under newly created recursive subtree
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-02-20 test --locked -p bop --test managed_watch_worker \
            recursive_notify_observes_metadata_under_new_team_directory \
            -- --ignored --exact --nocapture 2>&1 | tee diagnostic/recursive-path.log

      - name: Retain scoped raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bop-pr23-watch-terminal-diagnostic
          path: diagnostic/
          if-no-files-found: error
