[package]
name = "bop-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
blake3 = "1"
chrono.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.48.0", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_Globalization", "Win32_System_Com"] }

[target.'cfg(target_os = "redox")'.dependencies]
redox_users = { version = "=0.4.6", default-features = false }

[dev-dependencies]
tempfile = "3"
