[package]
name = "bop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
walkdir.workspace = true
url.workspace = true
bop-core = { path = "../bop-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "signal", "net"] }
axum = "0.7"
serde.workspace = true
notify = "6"
notify-debouncer-mini = "0.4"
subtle = "2"
tower = { version = "0.4", features = ["util"] }
tower_governor = "0.4"
rand = "0.8"
core-foundation = "0.9"
terminal_size = "0.4"
ratatui = "0.29"
crossterm = "0.28"
nucleo = "0.5"
# rustls instead of native-tls (SecureTransport on macOS has no TLS 1.3 / PQ).
# Keep reqwest's other defaults (charset, http2, system-proxy).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy"] }
# aws-lc-rs + prefer-post-quantum: offer X25519MLKEM768 hybrid key exchange first.
rustls = { version = "0.23", features = ["aws-lc-rs", "prefer-post-quantum"] }
async-trait = "0.1"
dirs.workspace = true
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tempfile = "3"
insta = "1"
chrono.workspace = true
serde_json.workspace = true
bop-core = { path = "../bop-core" }
