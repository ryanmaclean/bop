[workspace]
resolver = "2"
members = [
  "crates/bop-core",
    "crates/bop-cli",
    "vendor/unicode-ident-xid",
]
# bop-zellij-plugin is a WASM-only cdylib and must be built separately:
#   cargo build -p bop-zellij-plugin --target wasm32-wasip1 --release
# It cannot be compiled for the host target (cdylib + WASM-only deps).

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
url = "2"

# Full Unicode 17 implementation with explicit upstream MIT/Apache grants.
# See vendor/unicode-ident-xid/README.md for provenance and maintenance.
[patch.crates-io]
unicode-ident = { path = "vendor/unicode-ident-xid" }

[profile.release]
opt-level = 3
lto = "thin"
