# cargo-deny configuration
# Everything not in the allow list is denied by default (cargo-deny >= 0.14).
# The current repository instruction permits only MIT, BSD-2/3-Clause,
# and Apache-2.0. Historical fleet exceptions do not override that rule.

[licenses]
# This gate intentionally rejects the current unresolved dependency closure.
# Do not broaden it to make CI green; repair the dependency path first.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
]

# No per-package license exceptions.

[bans]
# No explicit bans needed — license check handles this.
deny = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# No blanket ignores. Any future advisory ignore must be added here as
# its own entry with the advisory id, the dependency path, and a review
# date, e.g.:
#   ignore = ["RUSTSEC-XXXX-NNNN"]  # <crate path> — reviewed YYYY-MM-DD, re-check by YYYY-MM-DD
