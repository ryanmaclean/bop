# cargo-deny configuration for the baseline MIT/BSD/Apache-2.0 policy.
# Extra licenses are confined to the exact selected BOP tooling versions below.
# New packages and versions remain denied until reviewed.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
]
include-dev = true
exceptions = [
  # Exact selected BOP CLI graph from paired FreeBSD diagnostic run 40160164120.
  { crate = "aws-lc-rs@1.18.1", allow = ["ISC"] },
  { crate = "aws-lc-sys@0.45.0", allow = ["ISC"] },
  { crate = "foldhash@0.1.5", allow = ["Zlib"] },
  { crate = "forwarded-header-value@0.1.1", allow = ["ISC"] },
  { crate = "icu_collections@2.1.1", allow = ["Unicode-3.0"] },
  { crate = "icu_locale_core@2.1.1", allow = ["Unicode-3.0"] },
  { crate = "icu_normalizer@2.1.1", allow = ["Unicode-3.0"] },
  { crate = "icu_normalizer_data@2.1.1", allow = ["Unicode-3.0"] },
  { crate = "icu_properties@2.1.2", allow = ["Unicode-3.0"] },
  { crate = "icu_properties_data@2.1.2", allow = ["Unicode-3.0"] },
  { crate = "icu_provider@2.1.1", allow = ["Unicode-3.0"] },
  { crate = "litemap@0.8.1", allow = ["Unicode-3.0"] },
  { crate = "notify@6.1.1", allow = ["CC0-1.0"] },
  { crate = "potential_utf@0.1.4", allow = ["Unicode-3.0"] },
  { crate = "ring@0.17.14", allow = ["ISC"] },
  { crate = "rustls-webpki@0.103.15", allow = ["ISC"] },
  { crate = "tinystr@0.8.2", allow = ["Unicode-3.0"] },
  { crate = "unicode-ident@1.0.24", allow = ["Unicode-3.0"] },
  { crate = "untrusted@0.9.0", allow = ["ISC"] },
  { crate = "webpki-roots@1.0.6", allow = ["CDLA-Permissive-2.0"] },
  { crate = "writeable@0.6.2", allow = ["Unicode-3.0"] },
  { crate = "yoke@0.8.1", allow = ["Unicode-3.0"] },
  { crate = "yoke-derive@0.8.1", allow = ["Unicode-3.0"] },
  { crate = "zerofrom@0.1.6", allow = ["Unicode-3.0"] },
  { crate = "zerofrom-derive@0.1.6", allow = ["Unicode-3.0"] },
  { crate = "zerotrie@0.2.3", allow = ["Unicode-3.0"] },
  { crate = "zerovec@0.11.5", allow = ["Unicode-3.0"] },
  { crate = "zerovec-derive@0.11.2", allow = ["Unicode-3.0"] },
]

[bans]
# No explicit package bans needed for the license check.
deny = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# No blanket ignores. Any future advisory ignore must be added here as
# its own entry with the advisory id, the dependency path, and a review
# date, e.g.:
#   ignore = ["RUSTSEC-XXXX-NNNN"]  # <crate path> — reviewed YYYY-MM-DD, re-check by YYYY-MM-DD
